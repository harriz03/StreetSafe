<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreetSafe Admin — Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">

<!-- Toast Container -->
<div class="toast-container position-fixed top-0 end-0 p-3" style="z-index:9999">
    <div id="mainToast" class="toast align-items-center border-0" role="alert" aria-live="assertive">
        <div class="d-flex">
            <div class="toast-body fw-semibold" id="toastMessage"></div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
    </div>
</div>

<div class="container-fluid vh-100 d-flex justify-content-center align-items-center">
    <div class="login-card shadow-lg">

        <div class="text-center mb-4">
            <div class="shield-circle mx-auto mb-3">🛡</div>
            <h2 class="fw-bold text-success-dark">StreetSafe Admin</h2>
            <p class="text-muted small">Incident Monitoring &amp; Management</p>
        </div>

        <div class="mb-3">
            <label class="form-label fw-semibold small">Admin Email</label>
            <input type="email" id="email" class="form-control custom-input" placeholder="admin@streetsafe.com" autocomplete="email">
            <div class="invalid-feedback" id="emailError">Please enter a valid email.</div>
        </div>

        <div class="mb-4">
            <label class="form-label fw-semibold small">Password</label>
            <div class="position-relative">
                <input type="password" id="password" class="form-control custom-input" placeholder="••••••••" autocomplete="current-password">
                <button type="button" class="password-toggle" id="togglePassword" tabindex="-1">👁</button>
            </div>
            <div class="invalid-feedback d-block" id="passwordError" style="display:none!important"></div>
        </div>

        <button id="loginBtn" type="button" class="btn custom-btn w-100">
            <span id="loginBtnText">Sign In</span>
            <span id="loginSpinner" class="spinner-border spinner-border-sm ms-2 d-none" role="status"></span>
        </button>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="auth.js"></script>
</body>
</html>
