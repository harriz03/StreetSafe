<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreetSafe Reports</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="dashboard-body">

<div class="d-flex">

    <!-- Sidebar -->
    <div class="sidebar">

        <div class="sidebar-header">
            <div class="shield-circle-small mb-3">
                🛡
            </div>

            <h4 class="fw-bold text-white">
                StreetSafe
            </h4>

            <p class="sidebar-subtitle">
                Admin Panel
            </p>
        </div>

        <div class="sidebar-menu mt-4">

            <a href="#" class="menu-item active-menu">
                <span>📋</span> Incident Reports
            </a>

            <a href="#" class="menu-item logout-btn mt-5">
                Logout
            </a>

        </div>

    </div>


    <!-- Main Content -->
    <div class="main-content">

        <!-- Top Header -->
        <div class="top-header shadow-sm">

            <div>
                <h3 class="fw-bold text-success-dark mb-1">
                    Incident Reports
                </h3>

                <p class="text-muted mb-0">
                    Manage active incidents and resolve reports
                </p>
            </div>

        </div>


        <!-- Dashboard Cards -->
        <div class="row mt-4 g-4">

            <div class="col-md-4">
                <div class="stat-card high-risk-card shadow-sm">
                    <h5>High Risk Reports</h5>

                    <h2 id="highCount">0</h2>
                </div>
            </div>

            <div class="col-md-4">
                <div class="stat-card medium-risk-card shadow-sm">
                    <h5>Medium Risk Reports</h5>

                    <h2 id="mediumCount">0</h2>
                </div>
            </div>

            <div class="col-md-4">
                 <div class="stat-card low-risk-card shadow-sm">
                    <h5>Low Risk Reports</h5>

                    <h2 id="lowCount">0</h2>
                 </div>
            </div>

        </div>


        <!-- Reports Table -->
        <div class="table-card shadow-sm mt-4">

            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="fw-bold text-success-dark mb-0">
                    Active Incident Reports
                </h5>
            </div>

            <div class="table-responsive">

                <table class="table align-middle">

                    <thead>
                        <tr>
                            <th>Incident</th>
                            <th>Location</th>
                            <th>Risk Level</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody id="reportsTableBody">

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>
<script type="module" src="reports.js"></script>
</body>
</html>
